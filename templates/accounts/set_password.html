{% extends "base.html" %}
{% block title %}Choose a password{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<h1>Choose a password</h1>
<p>For {{ target.email }}. Use at least 12 characters.</p>
<form method="post" class="stack" novalidate>
  {% csrf_token %}
  {% include "partials/form_body.html" %}
  <button type="submit" class="primary">Set password</button>
</form>
{% endblock %}
