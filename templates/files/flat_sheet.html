{% load trammel %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flat pattern · {{ fp.title }}</title>
<style>
  @page {
    size: letter; margin: 0.5in 0.5in 0.65in;
    @bottom-left { content: "Flat pattern · Printed {{ printed_at|dt }}"; font: 8pt Arial, Helvetica, sans-serif; color: #444; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt Arial, Helvetica, sans-serif; color: #444; }
  }
  * { box-sizing: border-box; }
  html { background: #e8e8e8; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.35; color: #000;
         background: #fff; max-width: 8.5in; margin: 1rem auto; padding: 0.5in; }
  @media print { html { background: none; } body { margin: 0; padding: 0; max-width: none; } }
  header { padding-bottom: 6pt; border-bottom: 3pt solid #000; margin-bottom: 10pt; }
  .shop { font-size: 9pt; text-transform: uppercase; letter-spacing: .08em; color: #333; }
  .doc-label { font-size: 9pt; font-weight: bold; text-transform: uppercase; letter-spacing: .12em; margin-top: 4pt; }
  h1 { font-size: 20pt; line-height: 1.1; margin: 2pt 0 0; }
  .sub { font-size: 9pt; color: #333; margin-top: 3pt; }
  .flat-print img { max-height: 6in; }
{% include "files/_flat_print_style.html" %}
</style></head>
<body>
<header>
  {% if business %}<div class="shop">{{ business.name }}</div>{% endif %}
  <div class="doc-label">Flat pattern</div>
  <h1>{{ fp.title }}</h1>
  <div class="sub">{{ fp.file }} · revision {{ fp.revision }} · {{ fp.k_note }}</div>
</header>
{% include "files/_flat_print.html" with sheet=True %}
</body></html>
