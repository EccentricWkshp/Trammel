{% if ready %}<a href="{{ href }}" target="_blank" rel="noopener"{% if lightbox %} data-lightbox="{{ title }}"{% endif %}{% if model and model_info %} data-model="{{ model }}" data-model-info="{{ model_info }}" data-units="{{ units }}"{% if flat %} data-flat="{{ flat }}"{% endif %}{% endif %}><img src="{{ thumb }}" alt="{{ alt }}"{% if lazy %} loading="lazy"{% endif %}></a>
{% elif waiting %}<span class="file-kind preview-wait" data-preview-wait="{{ status }}" data-preview-src="{{ thumb }}" data-preview-href="{{ href }}" data-preview-title="{{ title }}" data-preview-alt="{{ alt }}"{% if lightbox %} data-preview-lightbox="1"{% endif %}{% if model %} data-preview-model="{{ model }}" data-units="{{ units }}"{% endif %}>{{ kind|upper }} <small>Making the preview…</small></span>
{% else %}<span class="file-kind">{{ kind|upper }}</span>{% endif %}
