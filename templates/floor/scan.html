{% extends "floor/base.html" %}
{% block title %}Scan{% endblock %}
{% block content %}
<h1>Scan a traveler or label</h1>
<video id="scan-video" class="scan-video" playsinline muted data-find="{% url 'floor:find' %}"></video>
<p id="scan-status" role="status">Starting the camera…</p>
<form method="get" action="{% url 'floor:find' %}" class="floor-find">
  <label for="q">Or type the number</label>
  <div class="row"><input id="q" name="q" type="text" autocapitalize="characters" required><button type="submit" class="primary">Open</button></div>
</form>
{% endblock %}
