{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a href="?{{ query }}{% if query %}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">← Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span>
  {% if page.has_next %}<a href="?{{ query }}{% if query %}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">Next →</a>{% endif %}
</nav>
{% endif %}
