{% if can_use %}
<details class="floor-action" open>
  <summary><h2 class="inline-heading">Use on a work order</h2></summary>
  {% if work_orders %}
  <form method="post" action="{% url 'stock:floor_use' %}" class="stack">
    {% csrf_token %}
    <input type="hidden" name="material" value="{{ material.pk }}">
    {% if lot %}<input type="hidden" name="lot" value="{{ lot.pk }}">{% endif %}
    <input type="hidden" name="next" value="{{ here }}">
    <div><label for="use-wo">Work order</label>
      <select id="use-wo" name="work_order" required>
        <option value="">— choose —</option>
        {% for wo in work_orders %}<option value="{{ wo.pk }}"{% if wo.pk|stringformat:"s" == last_work_order %} selected{% endif %}>{{ wo.number }} · {{ wo.title }}</option>{% endfor %}
      </select></div>
    <div class="row">
      <div><label for="use-qty">Quantity</label><input id="use-qty" type="text" inputmode="decimal" name="quantity" required></div>
      <div><label for="use-unit">Unit</label><select id="use-unit" name="unit">{% for code, label in unit_choices %}<option value="{{ code }}"{% if code == material.unit %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    </div>
    <label class="check"><input type="checkbox" name="billable" checked><span>Bill the customer for it</span></label>
    <button type="submit" class="big primary">Use{% if lot %} from {{ lot.number }}{% endif %}</button>
  </form>
  {% else %}<p class="muted">No open work orders.</p>{% endif %}
</details>
{% endif %}
