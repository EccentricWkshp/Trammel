{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<p class="breadcrumb"><a href="{% url 'purchasing:list' %}">Purchase orders</a>{% if po %} › <a href="{{ po.get_absolute_url }}">{{ po }}</a>{% endif %}</p>
<h1>{{ title }}</h1>
<form method="post" class="stack" novalidate>
  {% csrf_token %}
  {% include "partials/form_body.html" %}
  <div class="actions">
    <button type="submit" class="primary">{% if po %}Save{% else %}Create and add lines{% endif %}</button>
    <a href="{% if po %}{{ po.get_absolute_url }}{% else %}{% url 'purchasing:list' %}{% endif %}">Cancel</a>
  </div>
</form>
{% endblock %}
