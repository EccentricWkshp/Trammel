# Trammel — proxy (Caddy, TLS), app, worker, database.
#
#   cp .env.example .env     # set SECRET_KEY, POSTGRES_PASSWORD, SITE_ADDRESS, BASE_URL
#   docker compose up -d
#
# The built-in proxy (Caddy) handles HTTPS. To use a reverse proxy the network
# already has instead, see docker-compose.external-proxy.yml.
#
# To build from this checkout instead of pulling the published image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

name: trammel

x-app: &app
  image: eccentricwkshp/trammel:${TRAMMEL_TAG:-latest}
  restart: unless-stopped
  env_file: [.env]
  # The app runs as an ordinary user and needs no Linux privileges at all.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    # The password goes on its own, not inside the URL, so any character in it
    # (%, /, #, @, ?) reaches PostgreSQL exactly as the database was given it.
    DATABASE_URL: postgresql://${POSTGRES_USER:-trammel}@db:5432/${POSTGRES_DB:-trammel}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    MEDIA_ROOT: /data/media
    BACKUP_DIR: /data/backups
    STATIC_HASHED: "true"
    # Only the built-in proxy can reach the app, so the address it appends to
    # X-Forwarded-For (and only that one) is believed. docker-compose.external-proxy.yml
    # narrows this.
    TRUSTED_PROXIES: "*"
  volumes:
    - media-data:/data/media
    - backup-data:/data/backups
  depends_on:
    db: {condition: service_healthy}

services:
  proxy:
    image: eccentricwkshp/trammel-caddy:${TRAMMEL_TAG:-latest}
    restart: unless-stopped
    # It keeps only what it needs to read and write its own files, and to bind
    # ports (Caddy's image marks the program as needing that, and won't start
    # without it, even on ports above 1024).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Published on the same port inside and out; the Caddyfile says why.
    ports:
      - "${HTTP_PORT:-8726}:${HTTP_PORT:-8726}"
      - "${HTTPS_PORT:-8727}:${HTTPS_PORT:-8727}"
      - "${HTTPS_PORT:-8727}:${HTTPS_PORT:-8727}/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy:/etc/caddy/modes:ro
      - ./config/caddy/certs:/etc/caddy/certs:ro
      - ./config/caddy/dns:/etc/caddy/dns:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-trammel.home.arpa}
      TLS_MODE: ${TLS_MODE:-internal}
      HTTP_PORT: ${HTTP_PORT:-8726}
      HTTPS_PORT: ${HTTPS_PORT:-8727}
      BASE_URL: ${BASE_URL:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      ACME_DNS_TOKEN: ${ACME_DNS_TOKEN:-}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    depends_on: [app]

  app:
    <<: *app
    command: ["web"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trammel}
      POSTGRES_USER: ${POSTGRES_USER:-trammel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Postgres 18 wants the volume one level above PGDATA.
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trammel} -d ${POSTGRES_DB:-trammel}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
  media-data:
  backup-data:
  caddy-data:
  caddy-config:
