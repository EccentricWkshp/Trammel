[project]
name = "trammel"
description = "Workshop management for small shops."
requires-python = ">=3.14"
dynamic = ["version"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "tests_*.py"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["error::RuntimeWarning", "error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = [
    "S101",  # assert is how pytest works
    "S105",  # "password" field names are not hard-coded secrets
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"**/tests*.py" = ["S"]
"tests/**" = ["S"]
# Default document and email templates: HTML/Jinja text reads better unwrapped.
"trammel/*/seed.py" = ["E501"]
"trammel/notifications/events.py" = ["E501"]
