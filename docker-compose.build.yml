# Build the images from this checkout instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    build: .
    image: trammel:local
  worker:
    image: trammel:local
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: trammel-caddy:local
