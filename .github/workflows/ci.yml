# Lint, tests against PostgreSQL, migration checks (an empty database, and an
# upgrade from the previous release with demo data), dependency audit and image
# build on every push and pull request. On a release tag: publish multi-arch
# images, then the GitHub Release that instances' update check reads (SPEC §4.1,
# §4.3, §11). Branch builds are amd64 only, to check the Dockerfiles quickly.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trammel
          POSTGRES_USER: trammel
          POSTGRES_PASSWORD: trammel-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trammel" --health-interval 2s
          --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://trammel:trammel-ci@localhost:5432/trammel
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the upgrade from the previous release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for PDF output
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Lint
        run: |
          ruff check .
          ruff format --check trammel config tests
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Tests
        run: pytest -q
      - name: Migrations apply cleanly to an empty database
        run: python manage.py migrate --noinput
      - name: Upgrade from the previous release
        run: bash .github/scripts/upgrade_from_previous.sh
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
      - name: Release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The app reports the VERSION file; a mismatch would make every
          # instance think an update is waiting.
          test "$(cat VERSION)" = "${{ steps.version.outputs.version }}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION))"; exit 1; }
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.version.outputs.platforms }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            eccentricwkshp/trammel:${{ steps.version.outputs.version }}
            eccentricwkshp/trammel:latest
      - name: Caddy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.caddy
          platforms: ${{ steps.version.outputs.platforms }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
          tags: |
            eccentricwkshp/trammel-caddy:${{ steps.version.outputs.version }}
            eccentricwkshp/trammel-caddy:latest
      - name: Docker Hub description (app)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: eccentricwkshp/trammel
          short-description: "Workshop management for small shops: quotes, jobs, work orders, invoicing."
          readme-filepath: ./docs/DOCKERHUB.md
      - name: Docker Hub description (Caddy)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: eccentricwkshp/trammel-caddy
          short-description: "HTTPS front end for Trammel, workshop management for small shops."
          readme-filepath: ./docs/DOCKERHUB.md

  # Running instances learn of a new version from the latest GitHub Release
  # (SPEC §4.3), so the images being published is not the end of a release.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_release.sh "$GITHUB_REF_NAME"
